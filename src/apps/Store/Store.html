<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ab Store</title>
<style>
:root{--fg:#f4f4f4;--mut:#9a9a9e;--win:#2a2a2c;--ct:#171717;--field:#3a3a3c;--act:#141414;--hov:rgba(255,255,255,.1);--bd:rgba(255,255,255,.26);--tile:#1e1e1e}
[data-theme=light]{--fg:#1b1b1d;--mut:#6b6b70;--win:#e6e6ea;--ct:#fbfbfc;--field:#d8d8de;--act:#fff;--hov:rgba(0,0,0,.08);--bd:rgba(0,0,0,.2);--tile:#f3f3f5}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--win);color:var(--fg);font:12px "Open Sans","Segoe UI",system-ui,sans-serif;user-select:none}
body{display:flex;gap:7px;padding:0 6px 6px}
aside{width:146px;flex:none;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.srch,.nav{height:24px;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:11.5px}
.srch{background:var(--field);margin-bottom:10px}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;user-select:text}
.srch input::placeholder{color:var(--fg);opacity:.85}
.nav{border:0;background:none;color:var(--fg);font:inherit;font-size:11.5px;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--hov)}.nav.on{background:var(--act)}
svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.gap{height:8px}
.ct{flex:1;min-width:0;background:var(--ct);border-radius:12px;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:9px;user-select:text}
h2{font-size:15px;font-weight:400}h3{font-size:12px;margin-top:4px}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut)}
input[type=text],input[type=url]{background:var(--field);border:0;border-radius:8px;color:var(--fg);padding:6px 8px;font:inherit;font-size:11.5px;outline:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row label{flex-direction:row;color:var(--fg)}
.btn{background:var(--field);color:var(--fg);border:0;border-radius:8px;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer}
.btn:hover{filter:brightness(1.2)}.btn.pri{background:var(--fg);color:var(--ct);font-weight:600}
.item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;background:var(--win)}
.tile{width:32px;height:32px;border-radius:8px;background:var(--tile);border:1px solid var(--bd);overflow:hidden;flex:none}
.tile img{width:100%;height:100%;object-fit:cover}
.letter{width:100%;height:100%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff}
.item b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.hint{font-size:10.5px;color:var(--mut)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<aside>
  <label class="srch"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L14 14"/></svg><input id="q" placeholder="Rechercher" aria-label="Rechercher"></label>
  <button class="nav" data-s="disc"><svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>Découvrir</button>
  <button class="nav" data-s="work"><svg viewBox="0 0 16 16"><path d="M14.5 1.5L1.5 7l4.5 2 2 4.5zM6 9l8.5-7.5"/></svg>Travail</button>
  <button class="nav" data-s="games"><svg viewBox="0 0 16 16"><rect x="2" y="10" width="12" height="4" rx="1.5"/><path d="M8 10V5.5"/><circle cx="8" cy="3.8" r="1.7"/></svg>Jeux</button>
  <button class="nav" data-s="mine"><svg viewBox="0 0 16 16"><path d="M2.5 13.5l6-6M8 3l5 5-2 2-5-5zM6.5 4.5L9 2"/></svg>Vos apps</button>
  <div class="gap"></div>
  <button class="nav" data-s="upd"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v2.6h-2.6"/></svg>Mise à jour</button>
</aside>
<section class="ct" id="ct"></section>
<script>
/* API fournie par index.html (window.parent.OS) ; repli minimal si ouvert seul */
const OS=(()=>{try{if(parent.OS)return parent.OS}catch(e){}
 const g=()=>JSON.parse(localStorage.getItem('apps')||'[]'),s=a=>localStorage.setItem('apps',JSON.stringify(a));
 return{cfg:{theme:'dark'},get apps(){return g()},addApp(a){s([...g(),a]);return true},removeApp(id){s(g().filter(a=>a.id!==id))},open(){},notify(t){console.log(t)}}})();
document.documentElement.dataset.theme=OS.cfg.theme;
const $=s=>document.querySelector(s),ct=$('#ct'),q=$('#q');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const icon=a=>{const l=`<div class="letter" style="background:hsl(${hue(a.name)} 35% 32%)">${esc((a.name[0]||'?').toUpperCase())}</div>`;
 return a.icon?`<img src="${esc(a.icon)}" alt="" onerror="this.outerHTML=this.dataset.f" data-f="${esc(l)}">`:l};
const titles={disc:'Découvrir',work:'Travail',games:'Jeux',mine:'Vos apps',upd:'Mise à jour'};
let cur='disc';

function parseMeta(html,base){
 const d=new DOMParser().parseFromString(html,'text/html');
 const name=(d.querySelector('meta[property="og:title"]')?.content||d.querySelector('meta[name="application-name"]')?.content||d.title||'').trim();
 const l=d.querySelector('link[rel~="apple-touch-icon"]')||d.querySelector('link[rel~="icon"]')||d.querySelector('link[rel="shortcut icon"]');
 let ic='';const href=l?.getAttribute('href')||d.querySelector('meta[property="og:image"]')?.content||'';
 if(href){try{ic=new URL(href,base||undefined).href}catch(e){}}
 return{name,icon:ic};
}
async function detectUrl(url){
 let name='',ic='';
 try{const m=parseMeta(await (await fetch(url)).text(),url);name=m.name;ic=m.icon}catch(e){}
 const u=new URL(url);
 return{name:name||u.hostname.replace(/^www\./,''),icon:ic||u.origin+'/favicon.ico'};
}
const list=(f='')=>{const r=OS.apps.filter(a=>a.name.toLowerCase().includes(f.toLowerCase()));
 return r.length?r.map(a=>`<div class="item"><div class="tile">${icon(a)}</div><b>${esc(a.name)}</b><button class="btn" data-o="${a.id}">Ouvrir</button><button class="btn" data-d="${a.id}">Supprimer</button></div>`).join(''):'<p class="hint">Aucune app pour le moment.</p>'};
function bind(){
 ct.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>OS.open(OS.apps.find(a=>a.id===x.dataset.o)));
 ct.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{OS.removeApp(x.dataset.d);show(cur,q.value.trim())});
}
function show(s,f=''){
 cur=s;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.s===s&&!f));
 if(f){ct.innerHTML=`<h2>Résultats</h2>${list(f)}`;return bind()}
 if(s==='upd')ct.innerHTML=`<h2>${titles[s]}</h2><p class="hint">Toutes vos apps sont à jour.</p>`;
 else if(s!=='mine')ct.innerHTML=`<h2>${titles[s]}</h2>`;
 else{ct.innerHTML=`<h2>${titles[s]}</h2>
 <div class="row"><label><input type="radio" name="t" value="url" checked> Lien</label><label><input type="radio" name="t" value="file"> Fichier HTML</label></div>
 <label id="lu">Adresse de l'app<input type="url" id="url" placeholder="https://exemple.com"></label>
 <label id="lf" hidden>Fichier HTML<input type="file" id="file" accept=".html,.htm,text/html"></label>
 <label>Lien de l'icône (facultatif)<input type="text" id="ic" placeholder="https://exemple.com/icone.png"></label>
 <label>Nom de l'app (facultatif)<input type="text" id="nm" placeholder="Repris de la page si vide"></label>
 <div class="row"><button class="btn pri" id="add">Ajouter</button></div>
 <h3>Mes apps</h3><div style="display:flex;flex-direction:column;gap:6px">${list()}</div>`;
 const g=x=>ct.querySelector(x);
 ct.querySelectorAll('[name=t]').forEach(r=>r.onchange=()=>{const f=r.value==='file'&&r.checked;g('#lu').hidden=f;g('#lf').hidden=!f});
 g('#add').onclick=async()=>{
  const type=ct.querySelector('[name=t]:checked').value;let name=g('#nm').value.trim(),ic=g('#ic').value.trim(),src='';const bt=g('#add');
  if(type==='url'){src=g('#url').value.trim();if(!src)return OS.notify('Entre une adresse');
   if(!/^https?:\/\//i.test(src))src='https://'+src;
   try{new URL(src)}catch(e){return OS.notify('Adresse invalide')}
   if(!name||!ic){bt.disabled=true;bt.textContent='Détection…';const d=await detectUrl(src);bt.disabled=false;bt.textContent='Ajouter';name=name||d.name;ic=ic||d.icon}
  }else{const f=g('#file').files[0];if(!f)return OS.notify('Choisis un fichier HTML');
   src=await f.text();const m=parseMeta(src);name=name||m.name||f.name.replace(/\.html?$/i,'');ic=ic||m.icon}
  if(!OS.addApp({id:'u'+Date.now(),name,icon:ic,type,src}))return OS.notify('Stockage plein : fichier trop lourd');
  show('mine')};
 }
 bind();
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{q.value='';show(n.dataset.s)});
q.oninput=()=>show(cur,q.value.trim());
show('disc');
</script>
</body>
</html>
