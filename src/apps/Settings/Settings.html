<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paramètres</title>
<style>
:root{--fg:#f4f4f4;--mut:#9a9a9e;--win:#2a2a2c;--ct:#171717;--field:#3a3a3c}
[data-theme=light]{--fg:#1b1b1d;--mut:#6b6b70;--win:#e6e6ea;--ct:#fbfbfc;--field:#d8d8de}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--win);color:var(--fg);font:12px "Open Sans","Segoe UI",system-ui,sans-serif;user-select:none}
body{display:flex;padding:0 6px 6px}
.ct{flex:1;background:var(--ct);border-radius:12px;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:9px}
h2{font-size:15px;font-weight:400}h3{font-size:12px;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.row{font-size:11.5px;cursor:pointer}
.btn{background:var(--field);color:var(--fg);border:0;border-radius:8px;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer}
.btn:hover{filter:brightness(1.2)}.btn.on{background:var(--fg);color:var(--ct);font-weight:600}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<section class="ct">
  <h2>Paramètres</h2>
  <h3>Thème</h3>
  <div class="row"><button class="btn" data-t="dark">Sombre</button><button class="btn" data-t="light">Clair</button></div>
  <h3>Horloge</h3>
  <label class="row"><input type="checkbox" id="h24"> Format 24 heures</label>
  <label class="row"><input type="checkbox" id="sec"> Afficher les secondes</label>
  <h3>Données</h3>
  <div class="row"><button class="btn" id="rst">Supprimer toutes mes apps</button></div>
</section>
<script>
/* API fournie par index.html (window.parent.OS) ; repli minimal si ouvert seul */
const OS=(()=>{try{if(parent.OS)return parent.OS}catch(e){}
 return{cfg:{theme:'dark',h24:true,sec:false},setCfg(p){Object.assign(this.cfg,p);document.documentElement.dataset.theme=this.cfg.theme},resetApps(){localStorage.removeItem('apps')}}})();
const $=s=>document.querySelector(s);
document.documentElement.dataset.theme=OS.cfg.theme;
const tb=[...document.querySelectorAll('[data-t]')];
const mark=()=>tb.forEach(x=>x.classList.toggle('on',x.dataset.t===OS.cfg.theme));mark();
tb.forEach(x=>x.onclick=()=>{OS.setCfg({theme:x.dataset.t});mark()});
$('#h24').checked=OS.cfg.h24;$('#sec').checked=OS.cfg.sec;
$('#h24').onchange=e=>OS.setCfg({h24:e.target.checked});
$('#sec').onchange=e=>OS.setCfg({sec:e.target.checked});
$('#rst').onclick=()=>{if(confirm('Supprimer toutes les apps ajoutées ?'))OS.resetApps()};
</script>
</body>
</html>
